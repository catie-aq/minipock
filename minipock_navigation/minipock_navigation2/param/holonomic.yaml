# Holonomic overlay, merged over common.yaml (lists replace the common ones).
# Lateral motion: vy up to 0.5 m/s, same acceleration limits as vx.

amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::OmniMotionModel"

controller_server:
  ros__parameters:
    FollowPath:
      motion_model: "Omni"
      vy_max: 0.5
      # No heading preference: PreferForwardCritic and PathAngleCritic turned the robot towards
      # its direction of travel (0.65 rad of drift on a 1 m lateral move, a half turn to reach a
      # goal 1 m behind). TwirlingCritic keeps the heading still while it translates.
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "TwirlingCritic"
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.5, 1.5]
    min_velocity: [-0.25, -0.5, -1.5]
    max_accel: [0.7, 0.7, 3.0]
    max_decel: [-1.5, -1.5, -3.0]
