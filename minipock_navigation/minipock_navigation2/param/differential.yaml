# Differential-drive overlay, merged over common.yaml (lists replace the common ones).

amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

controller_server:
  ros__parameters:
    FollowPath:
      motion_model: "DiffDrive"
      vy_max: 0.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [0.7, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
