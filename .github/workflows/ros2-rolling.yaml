name: "ROS2 Rolling"

# Early warning only: Rolling is not part of the pull request checks.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  ros2-rolling:
    uses: catie-aq/ros_workflows/.github/workflows/ros2-ci.yml@v2.0.0
    with:
      toolkit-ref: v2.0.0
      distributions: '["rolling"]'
      concurrency-group: rolling
      submodules: recursive
      merge-install: true
      packages: >-
        minipock
        minipock_bringup
        minipock_cartographer
        minipock_description
        minipock_firmware_updater
        minipock_gz
        minipock_navigation
        minipock_navigation2
        minipock_teleop
      skip-keys: micro_ros_agent
      pytest-args: '["-m", "not integration"]'
      container-env: '{"ROS_AUTOMATIC_DISCOVERY_RANGE": "LOCALHOST"}'
      pre-commit: false
      lint-ruff: false
      integration: false
    secrets:
      token: ${{ secrets.PAT }}
