name: "ROS2 CI/CD"

on:
  workflow_dispatch:
  pull_request:

jobs:
  ros2:
    uses: catie-aq/ros_workflows/.github/workflows/ros2-ci.yml@v2.0.0
    with:
      toolkit-ref: v2.0.0
      submodules: recursive
      merge-install: true
      packages: >-
        minipock
        minipock_bringup
        minipock_cartographer
        minipock_description
        minipock_firmware_updater
        minipock_gz
        minipock_navigation
        minipock_navigation2
        minipock_teleop
      skip-keys: micro_ros_agent
      pytest-args: '["-m", "not integration"]'
      container-env: '{"ROS_AUTOMATIC_DISCOVERY_RANGE": "LOCALHOST", "MINIPOCK_INTEGRATION": "1"}'
      pre-commit: true
      lint-ruff: false
      integration: true
      integration-runner: sonu-github-arc-gpu
      integration-packages: minipock_bringup
    secrets:
      token: ${{ secrets.PAT }}
