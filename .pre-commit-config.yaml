repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [ --unsafe ]
      # PGM maps are binary (written by world_to_map.py); a byte added at the end would differ
      # from the generated file on every regeneration.
      - id: end-of-file-fixer
        exclude: \.pgm$
      - id: trailing-whitespace
        exclude: \.pgm$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
